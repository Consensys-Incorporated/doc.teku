name: Check for broken links

on:
  pull_request:
    branches:
      - main

permissions: {} # lock everything by default (least-privilege)

jobs:
  linkCheck:
    name: Link Checking
    runs-on: ubuntu-24.04 # docs-link-check applies its Chrome sandbox fix on 24.04 only; Renovate leaves this pinned (renovate.json)
    permissions:
      contents: read  # least-privilege for this job only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: LinkCheck
        uses: Consensys-Incorporated/github-actions/docs-link-check@d7118b7e3733bac9a7f92f05f02f18c73892d5ad # 2.2.0
        with:
          CONFIG_FILE: .linkspector.yml
          CHANGED_FILES_ONLY: true
