name: Weekly check

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch: {}

concurrency:
  group: weekly-${{ github.ref }}
  cancel-in-progress: true

permissions: {} # lock everything by default (least-privilege)

jobs:
  linkCheck:
    name: Run link check
    runs-on: ubuntu-24.04 # docs-link-check applies its Chrome sandbox fix on 24.04 only; Renovate leaves this pinned (renovate.json)
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: LinkCheck
        uses: Consensys-Incorporated/github-actions/docs-link-check@d7118b7e3733bac9a7f92f05f02f18c73892d5ad # 2.2.0
        with:
          CONFIG_FILE: .linkspector.yml

  slackNotification:
    needs: linkCheck
    if: ${{ failure() }}
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Slack Notification
        uses: Consensys-Incorporated/github-actions/slack-notify@d7118b7e3733bac9a7f92f05f02f18c73892d5ad # 2.2.0
        with:
          SLACK_CHANNEL: ci-documentation
          SLACK_COLOR: danger
          SLACK_TITLE: Teku docs weekly link check - Failure
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          MSG_MINIMAL: true
