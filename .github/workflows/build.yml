    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Build
        uses: Consensys-Incorporated/github-actions/docs-build@89c262a30cae735be99dc776f9556b796fb456ca # v1.0.0
