---
name: Check file name case

on:
  pull_request:
    branches:
      - main

permissions: {} # lock everything by default (least-privilege)

jobs:
  case:
    name: Check for case being inconsistent
    runs-on: ubuntu-latest
    strategy:
      matrix:
        folder: ["docs"]
    permissions:
      contents: read  # least-privilege for this job only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Case check action
        uses: Consensys-Incorporated/github-actions/docs-case-check@d7118b7e3733bac9a7f92f05f02f18c73892d5ad # 2.2.0
        with:
          DOC_DIR: ${{ matrix.folder }}
