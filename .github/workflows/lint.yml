---
name: Check for lint errors

on:
  pull_request:
    branches:
      - main

permissions: {} # lock everything by default (least-privilege)

jobs:
  lint:
    name: Lint code and Markdown
    runs-on: ubuntu-latest
    permissions:
      contents: read  # least-privilege for this job only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint code
        uses: Consensys-Incorporated/github-actions/docs-lint-all@633ca293fa3bc3490d58840b085245780774c989 # 2.0.0

      - name: Check Markdown formatting
        run: npm run format:docs:check
