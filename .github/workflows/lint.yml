---
name: Check for lint errors

on:
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint 
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Lint code
        uses: Consensys-Incorporated/github-actions/docs-lint-all@89c262a30cae735be99dc776f9556b796fb456ca # v1.0.0

      - name: Lint markdown
        uses: Consensys-Incorporated/github-actions/docs-lint-markdown@89c262a30cae735be99dc776f9556b796fb456ca # v1.0.0
