---
name: Check for spelling with vale

on:
  pull_request:
    branches:
      - main

permissions: {} # lock everything by default (least-privilege)

jobs:
  vale:
    name: Spelling
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Vale
        uses: Consensys-Incorporated/github-actions/docs-spelling-check@d7118b7e3733bac9a7f92f05f02f18c73892d5ad # 2.2.0
        with:
          FILEPATHS: |
            docs/**/*.md
            docs/**/*.mdx
            versioned_docs/**/*.md
            versioned_docs/**/*.mdx
