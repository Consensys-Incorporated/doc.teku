---
name: Check for spelling with vale

on:
  pull_request:
    branches:
      - main

permissions: {} # lock everything by default (least-privilege)

jobs:
  vale:
    name: Spelling
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Vale
        uses: Consensys-Incorporated/github-actions/docs-spelling-check@10825e5427095aae0ca5686db2caa5029d693a4f # 2.0.1
        with:
          FILEPATHS: |
            docs/**/*.md
            docs/**/*.mdx
            versioned_docs/**/*.md
            versioned_docs/**/*.mdx
